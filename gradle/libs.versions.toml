# CodeIDE — catalogue de versions.
# Chaque version a été vérifiée sur son dépôt officiel le 2026-09-22 :
# AGP, AndroidX : https://dl.google.com/android/maven2
# Kotlin, KSP, Hilt, tests : https://repo.maven.apache.org/maven2
# Plugins Gradle : https://plugins.gradle.org
#
# Contrainte structurelle : AGP 9.4.1 embarque KGP 2.2.10 pour le Kotlin
# intégré ; kotlinx-serialization 1.9.0 est la dernière version compilée
# avec un Kotlin 2.2 lisible (1.10+ exige Kotlin 2.3).

[versions]
# Chaîne de build.
agp = "9.4.1"
kotlin = "2.2.10"
ksp = "2.3.12"
hilt = "2.60.1"
room = "2.8.5"

# SDK (source unique pour les convention plugins ; section 2 du prompt).
compileSdk = "37"
compileSdkMinor = "2"
minSdk = "26"
# 28, pas la dernière API : Android 10 interdit à une app targetSdk >= 29
# d'exécuter (exec) un binaire écrit dans ses données — restriction W^X.
# Tout le modèle du terminal intégré (second stage, apt, shell, JDK du
# bootstrap) exécute des binaires extraits dans filesDir/usr : le
# targetSdk reste bloqué à 28, précédent Termux (même raison). App
# chargée par side-loading — l'exigence Play (>= 34) ne s'applique pas.
# ADR 0045 ; règle maintenue après le retour d'appareil réel (v0.31.1).
targetSdk = "28"

# AndroidX.
androidx-annotation = "1.10.0"
androidx-core = "1.19.0"
androidx-appcompat = "1.8.0"
androidx-activity = "1.13.0"
androidx-fragment = "1.9.0"
androidx-navigation = "2.10.1"
androidx-lifecycle = "2.11.0"
androidx-recyclerview = "1.4.0"
androidx-swiperefreshlayout = "1.2.0"  # vérifiée sur Google Maven (dernière stable)
androidx-viewpager2 = "1.1.0"
# Bibliothèque d'édition (prompt compagnon, section 2.2) — tag stable vérifié
# sur github.com/jjoblab/code-editor le 2026-10-12 ; artefacts JitPack vérifiés
# (cel-lsp 3.49.2 : pom + module, résolution OK ; 3.49.2 = correctif de build
# JitPack safe.directory + install step explicite). Montée 3.41.0 → 3.49.2
# (v0.101.0) : compat API vérifiée par diff — zéro méthode publique retirée
# (cel-lsp/cel-core inchangés, EditorView en AJOUTS purs : guides
# d'indentation, sticky lines, color pickers, plis nommés) — et le Lot 3 de
# la lib (complétion native : mots-clés par registre + context gate) complète
# le mode instantané h4 côté éditeur.
code-editor = "3.49.2"
# Termux terminal-emulator (Apache-2.0) : sessions shell via pty — v0.118.3
# vérifiée sur JitPack le 2026-09-23 (com.github.termux.termux-app).
termux = "v0.118.3"
androidx-splashscreen = "1.2.0"
androidx-datastore = "1.2.1"
material = "1.14.0"

# Kotlin (bibliothèques).
coroutines = "1.11.0"
serialization = "1.9.0"
# LSP Kotlin (K1, ADR 0115) : org.jetbrains:syntax-api — l'arbre de
# construction syntaxique de la plateforme IntelliJ, contre lequel la
# grammaire vendorée du compilateur Kotlin est écrite. Hors Central :
# dépôt intellij-dependencies (accès par cache-redirector, voir
# settings.gradle.kts). Version épinglée par le tag amont v2.3.0 dans son
# propre libs.versions.toml — à monter ENSEMBLE du vendoring
# (lsp/kotlin/src/main/vendor/VENDOR.md). jetbrains-annotations (Central)
# est la seconde dépendance amont.
jetbrains-syntax-api = "0.3.340"
jetbrains-annotations = "26.0.2"

# Tests.
junit4 = "4.13.2"
androidx-test-core = "1.7.0"
robolectric = "4.17"
turbine = "1.2.1"
# org.json réel pour les tests JVM purs de core:crash (les stubs android.jar
# lèvent « not mocked » ; version vérifiée sur Maven Central).
org-json = "20260814"
turbine-coroutines-test = "1.11.0"

# Diagnostics en debug.
leakcanary = "2.14"

# Qualité (section 6 du prompt).
detekt = "1.23.8"
spotless = "8.10.2"
ktlint = "1.8.0"
kover = "0.9.9"
dokka = "2.2.0"

# Tooling Gradle (prompt compagnon Tooling — versions VÉRIFIÉES sur les dépôts
# officiels le 2026-09-24, jour de G2, et documentées dans docs/TOOLING.md) :
# gradle-tooling-api 9.7.1 = dernière stable, ALIGNÉE sur le Gradle du wrapper —
# les métadonnées Maven Central de cette coordonnée sont périmées (7.3-snapshot
# de 2021) : le dépôt de référence est repo.gradle.org/gradle/libs-releases,
# ajouté à settings.gradle.kts. shadow 9.6.1 = successeur maintenu de
# johnrengelman (fin de vie), vérifié sur le portail de plugins Gradle.
gradle-tooling-api = "9.7.1"
shadow = "9.6.1"

# Divers.
javax-inject = "1"
# Previews (PE1, PREVIEW.md P2) : moteur de rendu XML LayoutLib — dépôt
# jjoblab/LayoutLib (le même auteur que CodeIDE), dépendance Maven
# versionnée via JitPack. v2.1.1 = premier tag publiable (recette jitpack.yml
# + maven-publish appliquée, commit 6c56ab8) ; la mise à jour = bump ici.
layoutlib = "v2.1.2"

# Interface ViewBinding pour core:ui (même version que l'AGP, vérifié sur Google Maven ;
# AGP l'ajoute automatiquement aux modules qui activent viewBinding, core:ui la déclare explicitement).
viewbinding = "9.4.1"

# Mission « LSP Java » (prompt 2 — versions du module vendored lsp-java, vérifiées sur
# les dépôts officiels le 2026-10-11 : Maven Central pour jdt/lsp4j/gson/asm/junit-jupiter,
# Google Maven pour builder-model qui suit le train de versions de l'AGP).
eclipse-jdt-core = "3.40.0"
lsp4j = "0.21.2"
gson = "2.10.1"
asm = "9.7"
junit-jupiter = "5.10.1"
# La version du lanceur suit la version de la PLATEFORME JUnit (1.10.x
# pour Jupiter 5.10.x), pas celle de Jupiter.
junit-platform = "1.10.1"
# builder-model (com.android.tools.build) : interfaces du modèle v2 d'AGP résolu via
# la Tooling API — même train de versions que l'AGP (9.4.1), vérifié sur Google Maven.
# Compatible avec les projets cibles AGP 8+ (les interfaces v2 sont stables depuis 8.0).
builder-model = "9.4.1"

[libraries]
# AndroidX de base.
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidx-annotation" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidx-fragment" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "androidx-viewpager2" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidx-datastore" }

# Navigation.
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidx-navigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidx-navigation" }

# Cycle de vie.
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "androidx-lifecycle" }

# Interface.
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# Bibliothèque d'édition : seul module autorisé en dehors du catalogue usuel
# dans une feature (prompt compagnon, section 3) — embarque cel-core et
# cel-lsp-api en transitif.
codeeditor-ui = { group = "com.github.jjoblab.code-editor", name = "cel-ui", version.ref = "code-editor" }
# cel-lsp (mission « LSP Java » étape 4, §10) : intégration des serveurs de
# langage à l'éditeur (LspProject/LspEditor, transport in-process) — réservé
# à :lsp:hôte, PAS aux features (cel-ui reste la seule exception feature).
codeeditor-lsp = { group = "com.github.jjoblab.code-editor", name = "cel-lsp", version.ref = "code-editor" }
termux-terminal-emulator = { group = "com.github.termux.termux-app", name = "terminal-emulator", version.ref = "termux" }
termux-terminal-view = { group = "com.github.termux.termux-app", name = "terminal-view", version.ref = "termux" }

# Persistance.
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Injection (l'API @Inject du domaine est javax.inject, pure JVM).
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javax-inject" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# Interface ViewBinding (BaseFragment de core:ui ; suit la version de l'AGP).
androidx-viewbinding = { group = "androidx.databinding", name = "viewbinding", version.ref = "viewbinding" }

# Kotlin.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "turbine-coroutines-test" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Tooling Gradle (G2) : orchestrateur Tooling API (tooling:server uniquement).
gradle-tooling-api = { group = "org.gradle", name = "gradle-tooling-api", version.ref = "gradle-tooling-api" }

# Mission « LSP Java » — moteur vendored :lsp:java (jar Eclipse patché pour ART,
# lsp4j pour la façade LSP, gson pour les types de l'ancienne couche app) ;
# :lsp:ecj-art (patcheur ASM du build) ; :lsp:java en JUnit 5 (suite vendored) ;
# tooling:server consomme builder-model (modèle v2 AGP — étape 1).
eclipse-jdt-core = { group = "org.eclipse.jdt", name = "org.eclipse.jdt.core", version.ref = "eclipse-jdt-core" }
lsp4j = { group = "org.eclipse.lsp4j", name = "org.eclipse.lsp4j", version.ref = "lsp4j" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
asm-commons = { group = "org.ow2.asm", name = "asm-commons", version.ref = "asm" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }
android-builder-model = { group = "com.android.tools.build", name = "builder-model", version.ref = "builder-model" }

# Mission « LSP Kotlin » — :lsp:kotlin (K1, ADR 0115) : ce contre quoi la
# grammaire vendorée est écrite (api : nos types exposent SyntaxElementType)
# + annotations de l'amont (implementation).
jetbrains-syntax-api = { group = "org.jetbrains", name = "syntax-api", version.ref = "jetbrains-syntax-api" }
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }

# Mission « Previews » (PE1) : moteur de rendu XML (P1 — LayoutLib, dépôt
# jjoblab, JitPack v2.1.1 ; les modules frères transitent par les
# dépendances inter-modules réécrites par JitPack).
layoutlib-inflater = { group = "com.github.jjoblab.LayoutLib", name = "module-inflater", version.ref = "layoutlib" }

# Tests unitaires JVM.
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidx-test-core" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
org-json = { group = "org.json", name = "json", version.ref = "org-json" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

# Diagnostics en debug.
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
