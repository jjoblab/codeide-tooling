# CodeIDE — configuration Gradle commune.
# Réglages mémoire adaptés à l'environnement CI (4 Go de RAM, 2 cœurs).

# Machine virtuelle du démon Gradle.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Parallélisme et cache (section 11, étape 0).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=2

# Démon Kotlin autonome (mémoire bornée).
kotlin.daemon.jvmargs=-Xmx1024m

# Bibliothèques AndroidX obligatoires.
android.useAndroidX=true

# Non négociable : jamais de permission INTERNET par accident (règle 7).
# Le manifeste final est audité par lint.
