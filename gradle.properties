# CodeIDE — configuration Gradle commune.
# Réglages mémoire adaptés à l'environnement CI (4 Go de RAM, 2 cœurs).
#
# Depuis l'étape 1, les 18 modules ont du contenu réel (KSP, Hilt,
# Robolectric) : l'exécution parallèle empilait plusieurs JVM de test et
# déclenchait l'OOM killer du noyau. Le build est donc SÉQUENTIEL
# (parallélisme des modules et workers désactivés) et chaque tas est
# borné (voir aussi maxHeapSize des tests dans build-logic).

# Machine virtuelle du démon Gradle.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Parallélisme et cache (section 11, étape 0) — séquentiel depuis l'étape 1.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=1

# Compilation Kotlin DANS le démon Gradle (in-process) : sans cette option,
# des démons Kotlin autonomes s'empilent (plusieurs centaines de Mo chacun)
# jusqu'à déclencher l'OOM killer du noyau sur cette machine de 4 Go.
kotlin.compiler.execution.strategy=in-process

# Bibliothèques AndroidX obligatoires.
android.useAndroidX=true

# Non négociable : jamais de permission INTERNET par accident (règle 7).
# Le manifeste final est audité par lint.
